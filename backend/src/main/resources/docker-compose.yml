version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: gestion_cocktail_db
    environment:
      POSTGRES_DB: gestion_cocktail
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped


volumes:
  postgres_data: 