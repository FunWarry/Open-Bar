spring:
  main:
    allow-circular-references: false
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  sql:
    init:
      mode: always
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: off
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  security:
    jwt:
      secret: "${JWT_SECRET:test_openbar_default_secret_key_minimum_32_chars_long}"
      expiration: 86400000 # 24h

openbar:
  cors:
    allowed-origin-patterns: ${OPENBAR_CORS_ALLOWED_ORIGINS:*}

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  file:
    path: ${LOG_PATH:target/logs}

