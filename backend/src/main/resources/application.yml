spring:
  main:
    allow-circular-references: false
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  sql:
    init:
      mode: always
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: off
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
  security:
    jwt:
      secret: "${JWT_SECRET:test_openbar_default_secret_key_minimum_32_chars_long}"
      expiration: 14400000 # 4h

openbar:
  database:
    wait-for-connection: ${OPENBAR_WAIT_FOR_DB:true}
    poll-interval-seconds: ${OPENBAR_DB_POLL_INTERVAL:5}
    report-interval-seconds: ${OPENBAR_DB_REPORT_INTERVAL:60}
    max-wait-seconds: ${OPENBAR_DB_MAX_WAIT_SECONDS:900}
  cors:
    allowed-origin-patterns: ${OPENBAR_CORS_ALLOWED_ORIGINS:*}

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  file:
    path: ${LOG_PATH:target/logs}
  level:
    org.hibernate.orm.jdbc.warn: ERROR

