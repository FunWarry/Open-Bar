spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: false
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: off
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  security:
    jwt:
      secret: "${JWT_SECRET:test_openbar_default_secret_key_minimum_32_chars_long}"
      expiration: 86400000 # 24h

openbar:
  security:
    rate-limit:
      login:
        enabled: ${OPENBAR_RATE_LIMIT_LOGIN_ENABLED:true}
        capacity: ${OPENBAR_RATE_LIMIT_LOGIN_CAPACITY:5}
        refill-tokens: ${OPENBAR_RATE_LIMIT_LOGIN_REFILL_TOKENS:1}
        refill-duration-seconds: ${OPENBAR_RATE_LIMIT_LOGIN_REFILL_DURATION:12}

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
