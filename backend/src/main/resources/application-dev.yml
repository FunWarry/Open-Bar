# Profile DEV — Base de données développement (Vierge de données de test)
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:gestion_cocktail_dev}?sslmode=disable}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DEV_DB_PASSWORD:${POSTGRES_PASSWORD:${DB_PASSWORD:KZiXrsAw/asRtE8YJuxA8LkWtDXK5rPBmiriAHAu+7Q=}}}}
  security:
    jwt:
      secret: ${JWT_SECRET:dev_openbar_default_secret_key_minimum_32_chars_long}

server:
  port: ${SERVER_PORT:8081}

openbar:
  licensing:
    enforced: ${OPENBAR_LICENSING_ENFORCED:false}
    sync-enabled: ${OPENBAR_LICENSING_SYNC_ENABLED:false}
    public-key-pem: |
      -----BEGIN PUBLIC KEY-----
      MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEE0qs4A6+KX3AvmPGRENPgbcKhJGG
      SKEafioWglNu1pHNsPgsqFIisYfMx+kkrC/2uarRS0Y0JxJ+bihF4Uy1VA==
      -----END PUBLIC KEY-----
  monetization:
    sync-enabled: false
    enforce-grace-lock: false
    stripe-terminal-simulator-fallback: true

logging:
  level:
    org.springframework.security: DEBUG
    com.bar.gestioncocktail: DEBUG
    org.hibernate.SQL: off
    org.hibernate.orm.jdbc.warn: ERROR
