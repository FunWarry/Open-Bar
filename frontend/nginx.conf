log_format openbar_combined '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

# ==============================================================================
# HTTP Server (Port 80) — Automatic 301 Permanent Redirect to HTTPS (Port 443)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Centralized log persistence for frontend HTTP
    access_log /var/log/openbar/frontend/access.log openbar_combined;
    access_log /dev/stdout openbar_combined;
    error_log /var/log/openbar/frontend/error.log warn;
    error_log /dev/stderr warn;

    # Allow ACME Challenge for Let's Encrypt / custom cert validation
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# HTTPS Server (Port 443) — TLS Termination & Secure Reverse Proxy
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Centralized log persistence for frontend HTTPS
    access_log /var/log/openbar/frontend/access.log openbar_combined;
    access_log /dev/stdout openbar_combined;
    error_log /var/log/openbar/frontend/error.log warn;
    error_log /dev/stderr warn;

    # --------------------------------------------------------------------------
    # TLS / SSL Configuration
    # --------------------------------------------------------------------------
    ssl_certificate /etc/nginx/certs/openbar.crt;
    ssl_certificate_key /etc/nginx/certs/openbar.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    ssl_session_timeout 1d;
    ssl_session_cache shared:OpenBarSSL:10m;
    ssl_session_tickets off;

    # --------------------------------------------------------------------------
    # Security & Permissions Headers (Secure Context for PWA & QR Camera Access)
    # --------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # --------------------------------------------------------------------------
    # Gzip Compression
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff font/woff2;

    # --------------------------------------------------------------------------
    # Static Assets Caching
    # --------------------------------------------------------------------------
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Angular SPA History API Fallback
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # Backend REST API Reverse Proxy
    # --------------------------------------------------------------------------
    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 90s;
    }

    # --------------------------------------------------------------------------
    # WebSocket STOMP Reverse Proxy
    # --------------------------------------------------------------------------
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
