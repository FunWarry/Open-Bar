<div class="notification-panel-container" data-testid="notification-panel-container">
  <div class="panel-header">
    <div class="panel-title">
      <ion-icon name="notifications-outline" class="title-icon"></ion-icon>
      <h3>Notifications</h3>
    </div>
    <div class="header-actions">
      <ion-button fill="clear" size="small" (click)="marquerToutLu()" (keyup.enter)="marquerToutLu()" class="action-btn" data-testid="notif-mark-all-read">
        <ion-icon name="checkmark-done-outline" slot="start"></ion-icon>
        Tout lu
      </ion-button>
      <ion-button fill="clear" size="small" (click)="fermer()" (keyup.enter)="fermer()" class="close-btn" data-testid="notif-close-btn">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </div>
  </div>

  <div class="panel-body">
    @if (notifications.length === 0) {
      <div class="empty-notifs" data-testid="empty-notifs">
        <ion-icon name="notifications-off-outline"></ion-icon>
        <p>Aucune notification</p>
      </div>
    } @else {
      <div class="notif-list" data-testid="notif-list">
        @for (n of notifications; track n.id) {
          <div
            class="notif-item"
            [class.lue]="n.lue"
            (click)="marquerLue(n.id)"
            (keyup.enter)="marquerLue(n.id)"
            tabindex="0"
            role="button"
            data-testid="notif-item">
            <div class="notif-badge-wrapper">
              <span class="notif-type-badge" [attr.data-type]="n.type">
                {{ n.type }}
              </span>
            </div>
            <div class="notif-content">
              <p class="notif-message">{{ n.message }}</p>
              <span class="notif-time">{{ n.timestamp | date:'HH:mm dd/MM' }}</span>
            </div>
            @if (!n.lue) {
              <span class="unread-dot" data-testid="unread-dot"></span>
            }
          </div>
        }
      </div>
    }
  </div>
</div>
