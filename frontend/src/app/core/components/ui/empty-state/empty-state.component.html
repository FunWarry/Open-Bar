<div class="empty-state-container">
  <div class="empty-icon-wrapper">
    <ion-icon [name]="icon"></ion-icon>
  </div>
  <h3 class="empty-title">{{ title }}</h3>
  @if (subtitle) {
    <p class="empty-subtitle">{{ subtitle }}</p>
  }
  @if (actionLabel) {
    <ion-button color="primary" fill="solid" (click)="onAction()" (keyup.enter)="onAction()" (keyup.space)="onAction()" class="empty-action-btn">
      {{ actionLabel }}
    </ion-button>
  }
</div>
