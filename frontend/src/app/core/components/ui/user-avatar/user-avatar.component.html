<ion-avatar [class]="'avatar-' + size">
  @if (avatarUrl) {
    <img [src]="avatarUrl" [alt]="name || 'User Avatar'" />
  } @else {
    <div class="avatar-fallback" [style.background]="roleColor">
      <span>{{ initials }}</span>
    </div>
  }
  @if (role) {
    <div class="avatar-role-badge">
      <ion-icon [name]="roleIcon"></ion-icon>
    </div>
  }
</ion-avatar>
