<button
  [type]="type"
  [disabled]="disabled || loading"
  [class.btn-block]="expand === 'block' || expand === 'full'"
  [ngClass]="['btn', 'btn--' + variant, size === 'small' ? 'btn-sm' : '']"
  (click)="onClick($event)">
  @if (loading) {
    <ion-spinner name="crescent" class="btn-spinner"></ion-spinner>
  }
  @if (icon && !loading) {
    <ion-icon [name]="icon" class="btn-icon"></ion-icon>
  }
  <ng-content></ng-content>
</button>
