<button
  [type]="type"
  [disabled]="disabled || loading"
  [class.btn-block]="expand === 'block' || expand === 'full'"
  [ngClass]="['btn', 'btn--' + variant, size === 'small' ? 'btn-sm' : '']"
  (click)="onClick($event)">
  <ion-spinner *ngIf="loading" name="crescent" class="btn-spinner"></ion-spinner>
  <ion-icon *ngIf="icon && !loading" [name]="icon" class="btn-icon"></ion-icon>
  <ng-content></ng-content>
</button>
