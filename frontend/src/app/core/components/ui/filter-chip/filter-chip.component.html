<ion-chip
  [color]="active ? 'primary' : 'medium'"
  [outline]="!active"
  [disabled]="disabled"
  class="filter-chip"
  [attr.data-testid]="testId"
  (click)="onClick()"
  (keyup.enter)="onClick()"
  (keyup.space)="onClick()">
  @if (icon) {
    <ion-icon [name]="icon"></ion-icon>
  }
  <ion-label>{{ label }}</ion-label>
</ion-chip>
