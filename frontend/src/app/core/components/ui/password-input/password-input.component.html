<div class="field-container">
  @if (label) {
    <label class="field-label" [attr.for]="inputId">
      {{ label }} @if (required) { <span class="required-star">*</span> }
    </label>
  }
  <div class="input-wrapper" [class.has-error]="errorMessage" [class.is-disabled]="disabled">
    <ion-icon name="lock-closed" class="field-icon"></ion-icon>
    <input
      [id]="inputId"
      [type]="showPassword ? 'text' : 'password'"
      [value]="value"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [required]="required"
      [autocomplete]="autocomplete"
      (input)="onInput($event)"
      (blur)="onBlur()"
      class="native-input"
    />
    <button type="button" class="toggle-btn" (click)="toggleVisibility()" [disabled]="disabled">
      {{ showPassword ? 'Masquer' : 'Afficher' }}
    </button>
  </div>
  @if (errorMessage) {
    <div class="field-error">
      ⚠ {{ errorMessage }}
    </div>
  }
  @if (helperText && !errorMessage) {
    <div class="field-helper">
      {{ helperText }}
    </div>
  }
</div>
