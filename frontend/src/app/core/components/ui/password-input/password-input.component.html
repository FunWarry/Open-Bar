<ion-item class="password-field-item">
  <ion-icon name="lock-closed" slot="start"></ion-icon>
  <ion-label *ngIf="label" position="floating">{{ label }}</ion-label>
  <ion-input
    [type]="showPassword ? 'text' : 'password'"
    [value]="value"
    [placeholder]="placeholder"
    [disabled]="disabled"
    [required]="required"
    [autocomplete]="autocomplete"
    (ionInput)="onInput($event)"
    (ionBlur)="onBlur()">
  </ion-input>
  <ion-button fill="clear" slot="end" (click)="toggleVisibility()" (keyup.enter)="toggleVisibility()" (keyup.space)="toggleVisibility()" [disabled]="disabled">
    <ion-icon [name]="showPassword ? 'eye-off' : 'eye'" slot="icon-only"></ion-icon>
  </ion-button>
</ion-item>
<ion-note color="danger" *ngIf="errorMessage" class="field-note">
  {{ errorMessage }}
</ion-note>
<ion-note color="medium" *ngIf="helperText && !errorMessage" class="field-note">
  {{ helperText }}
</ion-note>
