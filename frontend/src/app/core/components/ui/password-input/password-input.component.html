<div class="field-container">
  <label *ngIf="label" class="field-label">
    {{ label }} <span *ngIf="required" class="required-star">*</span>
  </label>
  <div class="input-wrapper" [class.has-error]="errorMessage" [class.is-disabled]="disabled">
    <ion-icon name="lock-closed" class="field-icon"></ion-icon>
    <input
      [type]="showPassword ? 'text' : 'password'"
      [value]="value"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [required]="required"
      [autocomplete]="autocomplete"
      (input)="onInput($event)"
      (blur)="onBlur()"
      class="native-input"
    />
    <button type="button" class="toggle-btn" (click)="toggleVisibility()" [disabled]="disabled">
      {{ showPassword ? 'Masquer' : 'Afficher' }}
    </button>
  </div>
  <div *ngIf="errorMessage" class="field-error">
    ⚠ {{ errorMessage }}
  </div>
  <div *ngIf="helperText && !errorMessage" class="field-helper">
    {{ helperText }}
  </div>
</div>
