<div class="error-404-container" data-testid="error-404-container">
  <div class="ellipse-bg-primary"></div>
  <div class="ellipse-bg-tertiary"></div>

  <div class="error-404-card">
    <h1 class="hero-code">{{ 'ERROR_404.CODE' | transloco }}</h1>
    <h2 class="error-title">{{ 'ERROR_404.TITLE' | transloco }}</h2>
    <p class="error-description">{{ 'ERROR_404.DESCRIPTION' | transloco }}</p>

    <div class="actions-row">
      <app-action-button
        variant="primary"
        size="large"
        data-testid="btn-404-home"
        routerLink="/app-home">
        {{ 'ERROR_404.BACK_HOME' | transloco }}
      </app-action-button>
    </div>
  </div>
</div>
