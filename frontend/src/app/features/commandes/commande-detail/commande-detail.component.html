<ion-card>
  <ion-card-header>
    <div class="card-header-row">
      <ion-card-title>Détails de la Commande #{{ commandeId }}</ion-card-title>
      <ion-buttons>
        <ion-button fill="clear" (click)="router.navigate(['/commandes'])">
          <ion-icon slot="start" name="arrow-back"></ion-icon>
          Retour
        </ion-button>
        <ion-button fill="outline" color="primary" (click)="onEdit()">
          <ion-icon slot="start" name="create"></ion-icon>
          Modifier
        </ion-button>
        <ion-button fill="outline" color="danger" (click)="onDelete()">
          <ion-icon slot="start" name="trash"></ion-icon>
          Supprimer
        </ion-button>
      </ion-buttons>
    </div>
  </ion-card-header>
  <ion-card-content>
    <ng-container *ngIf="commande">
      <ion-list lines="full">
        <ion-item>
          <ion-label>
            <span class="detail-label">Table</span>
            <span class="detail-value">{{ commande.tableId }}</span>
          </ion-label>
        </ion-item>
        <ion-item>
          <ion-label>
            <span class="detail-label">Statut</span>
          </ion-label>
          <ion-badge slot="end" [color]="getStatusColor(commande.status)">
            {{ commande.status }}
          </ion-badge>
        </ion-item>
        <ion-item>
          <ion-label>
            <span class="detail-label">Total</span>
            <span class="detail-value">{{ commande.total | currency:'EUR' }}</span>
          </ion-label>
        </ion-item>
      </ion-list>

      <h3 class="section-title">Items de la commande</h3>
      <div class="list-header">
        <span>Nom</span><span>Quantité</span><span>Prix</span>
      </div>
      <ion-list>
        <ion-item *ngFor="let item of commande.items">
          <ion-label>{{ item.name }}</ion-label>
          <ion-label slot="end">{{ item.quantity }}</ion-label>
          <ion-label slot="end">{{ item.price | currency:'EUR' }}</ion-label>
        </ion-item>
      </ion-list>
    </ng-container>
  </ion-card-content>
</ion-card>
