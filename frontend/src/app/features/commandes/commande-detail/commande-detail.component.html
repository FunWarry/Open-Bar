<ion-card>
  <ion-card-header>
    <div class="card-header-row">
      <ion-card-title>Détails de la Commande #{{ commande?.id }}</ion-card-title>
      <ion-buttons>
        <ion-button fill="clear" (click)="router.navigate(['/commandes'])">
          <ion-icon slot="start" name="arrow-back"></ion-icon>
          Retour
        </ion-button>
        <ion-button fill="outline" color="danger" (click)="onAnnuler()" *ngIf="peutAnnuler()">
          <ion-icon slot="start" name="ban-outline"></ion-icon>
          Annuler
        </ion-button>
      </ion-buttons>
    </div>
  </ion-card-header>
  <ion-card-content>
    <div *ngIf="isLoading" class="loading-state">
      <ion-spinner name="crescent" color="primary"></ion-spinner>
    </div>
    <ng-container *ngIf="commande">
      <ion-list lines="full">
        <ion-item>
          <ion-label>
            <span class="detail-label">Table</span>
            <span class="detail-value">{{ commande.tableNumero }}</span>
          </ion-label>
        </ion-item>
        <ion-item>
          <ion-label>
            <span class="detail-label">Statut</span>
          </ion-label>
          <ion-badge slot="end" [color]="getStatutColor(commande.statut)">
            {{ commande.statut }}
          </ion-badge>
        </ion-item>
        <ion-item>
          <ion-label>
            <span class="detail-label">Total</span>
            <span class="detail-value">{{ commande.total | currency:'EUR' }}</span>
          </ion-label>
        </ion-item>
      </ion-list>

      <h3 class="section-title">Items de la commande</h3>
      <div class="list-header">
        <span>Nom</span><span>Quantité</span><span>Prix</span>
      </div>
      <ion-list>
        <ion-item *ngFor="let item of commande.items">
          <ion-label>{{ item.cocktailNom }}</ion-label>
          <ion-label slot="end">{{ item.quantite }}</ion-label>
          <ion-label slot="end">{{ item.prixUnitaire | currency:'EUR' }}</ion-label>
        </ion-item>
      </ion-list>
    </ng-container>
  </ion-card-content>
</ion-card>
