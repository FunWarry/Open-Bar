<div class="commande-list-container">
  <ion-card>
    <ion-card-header>
      <div class="card-header-row">
        <ion-card-title>Liste des Commandes</ion-card-title>
        <ion-button color="primary" (click)="onAdd()">
          <ion-icon slot="start" name="add"></ion-icon>
          Nouvelle Commande
        </ion-button>
      </div>
    </ion-card-header>
    <ion-card-content>
      <div class="list-header">
        <span>Table</span>
        <span>Statut</span>
        <span>Total</span>
        <span>Actions</span>
      </div>
      <ion-list>
        <ion-item *ngFor="let commande of items; trackBy: trackById">
          <ion-label>
            <h3>Table {{ commande.table }}</h3>
          </ion-label>
          <ion-badge slot="end" [color]="getStatusColor(commande.status)">
            {{ commande.status }}
          </ion-badge>
          <ion-label slot="end" class="col-total">{{ commande.total | currency:'EUR' }}</ion-label>
          <ion-buttons slot="end">
            <ion-button fill="clear" color="primary" (click)="onView(commande)">
              <ion-icon slot="icon-only" name="eye"></ion-icon>
            </ion-button>
            <ion-button fill="clear" color="tertiary" (click)="onEdit(commande)">
              <ion-icon slot="icon-only" name="create"></ion-icon>
            </ion-button>
            <ion-button fill="clear" color="danger" (click)="onDelete(commande)">
              <ion-icon slot="icon-only" name="trash"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>
</div>
