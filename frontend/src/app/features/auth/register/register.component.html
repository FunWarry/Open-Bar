<div class="register-container">
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="register-card">
    <div class="register-header">
      <h1 class="register-title">{{ 'AUTH.REGISTER_TITLE' | transloco }}</h1>
      <p class="register-subtitle">Accès administrateur requis pour ajouter des utilisateurs</p>
    </div>

    <div class="divider"></div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
      <div class="name-row">
        <app-input-field
          formControlName="nom"
          [label]="'SETUP.LASTNAME' | transloco"
          placeholder="Nom"
          icon="person-outline"
          [required]="true"
          [errorMessage]="registerForm.get('nom')?.touched && registerForm.get('nom')?.hasError('required') ? ('ERRORS.FORM_INVALID' | transloco) : undefined">
        </app-input-field>

        <app-input-field
          formControlName="prenom"
          [label]="'SETUP.FIRSTNAME' | transloco"
          placeholder="Prénom"
          icon="person-outline"
          [required]="true"
          [errorMessage]="registerForm.get('prenom')?.touched && registerForm.get('prenom')?.hasError('required') ? ('ERRORS.FORM_INVALID' | transloco) : undefined">
        </app-input-field>
      </div>

      <app-input-field
        formControlName="email"
        [label]="'AUTH.EMAIL' | transloco"
        type="email"
        placeholder="exemple@openbar.local"
        icon="mail-outline"
        [required]="true"
        autocomplete="email"
        [errorMessage]="registerForm.get('email')?.touched && registerForm.get('email')?.hasError('required') ? ('AUTH.REQUIRED_USER' | transloco) : (registerForm.get('email')?.touched && registerForm.get('email')?.hasError('email') ? ('ERRORS.FORM_INVALID' | transloco) : undefined)">
      </app-input-field>

      <app-input-field
        formControlName="username"
        [label]="'AUTH.USERNAME' | transloco"
        placeholder="Identifiant de connexion"
        icon="at-outline"
        [required]="true"
        autocomplete="username"
        [errorMessage]="registerForm.get('username')?.touched && registerForm.get('username')?.hasError('required') ? ('AUTH.REQUIRED_USER' | transloco) : undefined">
      </app-input-field>

      <app-password-input
        formControlName="password"
        [label]="'AUTH.PASSWORD' | transloco"
        placeholder="Au moins 6 caractères"
        [required]="true"
        autocomplete="new-password"
        [errorMessage]="registerForm.get('password')?.touched && registerForm.get('password')?.hasError('required') ? ('AUTH.REQUIRED_PASS' | transloco) : (registerForm.get('password')?.touched && registerForm.get('password')?.hasError('minlength') ? ('ERRORS.FORM_INVALID' | transloco) : undefined)">
      </app-password-input>

      <div class="field">
        <label for="role-select">Rôle</label>
        <ion-item class="role-select-item" lines="none">
          <ion-select id="role-select" formControlName="role" required interface="popover" placeholder="Sélectionnez un rôle">
            @for (role of roles; track role) {
              <ion-select-option [value]="role">
                {{ role }}
              </ion-select-option>
            }
          </ion-select>
        </ion-item>
        @if (registerForm.get('role')?.touched && registerForm.get('role')?.hasError('required')) {
          <div class="field-error">
            Le rôle est requis
          </div>
        }
      </div>

      <app-action-button
        type="submit"
        variant="primary"
        size="large"
        expand="block"
        [disabled]="registerForm.invalid">
        {{ 'AUTH.REGISTER_BTN' | transloco }}
      </app-action-button>
    </form>
  </div>
</div>
