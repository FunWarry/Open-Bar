<div class="login-container">
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="login-card">
    <div class="card-brand">
      <span class="brand-icon">🍹</span>
      <h1 class="login-title">OpenBar</h1>
    </div>
    <p class="login-subtitle">{{ 'AUTH.LOGIN_TITLE' | transloco }}</p>

    <div class="divider"></div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <app-input-field
        formControlName="username"
        [label]="'AUTH.USERNAME' | transloco"
        placeholder="admin@openbar.local"
        icon="mail-outline"
        [required]="true"
        autocomplete="username"
        [errorMessage]="
          loginForm.get('username')?.touched && loginForm.get('username')?.hasError('required')
            ? ('AUTH.REQUIRED_USER' | transloco)
            : undefined
        ">
      </app-input-field>

      <app-password-input
        formControlName="password"
        [label]="'AUTH.PASSWORD' | transloco"
        placeholder="••••••••"
        [required]="true"
        autocomplete="current-password"
        [errorMessage]="
          loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')
            ? ('AUTH.REQUIRED_PASS' | transloco)
            : undefined
        ">
      </app-password-input>

      @if (errorMessage) {
        <div class="error-toast">
          <div class="toast-accent"></div>
          <div class="toast-content">
            <span class="toast-icon">✕</span>
            <span class="toast-message">{{ errorMessage }}</span>
          </div>
        </div>
      }

      <app-action-button
        type="submit"
        variant="primary"
        size="large"
        expand="block"
        [disabled]="loginForm.invalid">
        {{ 'AUTH.LOGIN_BTN' | transloco }}
      </app-action-button>
    </form>
  </div>
</div>
