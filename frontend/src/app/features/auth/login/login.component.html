<div class="login-container">
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="login-card">
    <h1 class="login-title">OpenBar</h1>
    <p class="login-subtitle">Connexion à votre espace bar</p>

    <div class="divider"></div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <app-input-field
        formControlName="username"
        label="Email"
        placeholder="admin@openbar.com"
        icon="mail-outline"
        [required]="true"
        autocomplete="username"
        [errorMessage]="loginForm.get('username')?.touched && loginForm.get('username')?.hasError('required') ? 'Nom d\'utilisateur requis' : undefined">
      </app-input-field>

      <app-password-input
        formControlName="password"
        label="Mot de passe"
        placeholder="••••••••"
        [required]="true"
        autocomplete="current-password"
        [errorMessage]="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required') ? 'Mot de passe requis' : undefined">
      </app-password-input>

      <div class="error-toast" *ngIf="errorMessage">
        <div class="toast-accent"></div>
        <div class="toast-content">
          <span class="toast-icon">✕</span>
          <span class="toast-message">{{ errorMessage }}</span>
        </div>
      </div>

      <app-action-button
        type="submit"
        variant="primary"
        expand="block"
        [disabled]="loginForm.invalid">
        Se connecter
      </app-action-button>
    </form>
  </div>
</div>
