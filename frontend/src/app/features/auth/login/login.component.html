<div class="login-container">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Connexion</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <app-input-field
          formControlName="username"
          label="Nom d'utilisateur"
          placeholder="Entrez votre identifiant"
          icon="person-outline"
          [required]="true"
          autocomplete="username"
          [errorMessage]="loginForm.get('username')?.touched && loginForm.get('username')?.hasError('required') ? 'Le nom d\'utilisateur est requis' : undefined">
        </app-input-field>

        <app-password-input
          formControlName="password"
          label="Mot de passe"
          placeholder="Entrez votre mot de passe"
          [required]="true"
          autocomplete="current-password"
          [errorMessage]="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required') ? 'Le mot de passe est requis' : undefined">
        </app-password-input>

        <ion-note color="danger" *ngIf="errorMessage">
          {{ errorMessage }}
        </ion-note>

        <app-action-button
          type="submit"
          variant="primary"
          expand="block"
          [disabled]="loginForm.invalid">
          Se connecter
        </app-action-button>
      </form>
    </ion-card-content>
  </ion-card>
</div>
