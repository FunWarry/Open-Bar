<div class="login-container">
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="login-card">
    <div class="login-header">
      <h1 class="login-title">OpenBar</h1>
      <p class="login-subtitle">Connexion à votre espace bar</p>
    </div>

    <div class="divider"></div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <app-input-field
        formControlName="username"
        label="Nom d'utilisateur"
        placeholder="Entrez votre identifiant"
        icon="person-outline"
        [required]="true"
        autocomplete="username"
        [errorMessage]="loginForm.get('username')?.touched && loginForm.get('username')?.hasError('required') ? 'Le nom d\'utilisateur est requis' : undefined">
      </app-input-field>

      <app-password-input
        formControlName="password"
        label="Mot de passe"
        placeholder="Entrez votre mot de passe"
        [required]="true"
        autocomplete="current-password"
        [errorMessage]="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required') ? 'Le mot de passe est requis' : undefined">
      </app-password-input>

      <div class="error-banner" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <app-action-button
        type="submit"
        variant="primary"
        expand="block"
        [disabled]="loginForm.invalid">
        Se connecter
      </app-action-button>
    </form>
  </div>
</div>
