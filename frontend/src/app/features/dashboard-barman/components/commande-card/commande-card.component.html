<div
  class="commande-card"
  [class.prioritaire]="commande.prioritaire"
  (click)="openDetails()"
  (keydown.enter)="openDetails()"
>
  <!-- Liseré de statut (barre verticale colorée) -->
  <div class="lisere" [style.background-color]="lisereColor"></div>

  <div class="card-content">
    <!-- En-tête : table + badge statut -->
    <div class="card-header">
      <div class="card-header-text">
        <span class="table-name">Table {{ commande.tableNom }}</span>
        <span class="order-id">#{{ commande.id }}</span>
        <span class="card-timer">
          <ion-icon name="time-outline"></ion-icon>
          {{ tempsEcoule }}
        </span>
      </div>
      <app-status-badge [status]="commande.statut" [prioritary]="commande.prioritaire"></app-status-badge>
    </div>

    <div class="divider"></div>

    <!-- Liste des items -->
    <ul class="items-list">
      <li *ngFor="let item of groupedItems" class="item-row">
        <span class="qty">{{ item.quantite }}×</span>
        <span class="cocktail-nom">{{ item.cocktailNom }}</span>
        <span *ngIf="item.notes" class="item-note">— {{ item.notes }}</span>
      </li>
    </ul>

    <p *ngIf="commande.notes" class="commande-notes">📝 {{ commande.notes }}</p>

    <!-- Actions -->
    <div class="card-actions" (click)="$event.stopPropagation()" (keydown.enter)="$event.stopPropagation()">
      <app-action-button
        *ngIf="commande.statut === 'EN_ATTENTE'"
        variant="primary"
        icon="arrow-forward-circle-outline"
        expand="block"
        title="Démarrer la préparation de la commande"
        (btnClick)="onPrendreEnCharge($event)">
        Démarrer
      </app-action-button>

      <app-action-button
        *ngIf="commande.statut === 'EN_PREPARATION'"
        variant="primary"
        icon="checkmark-circle-outline"
        expand="block"
        title="Marquer la commande comme prête"
        (btnClick)="onMarquerPret($event)">
        Marquer prêt
      </app-action-button>
    </div>
  </div>
</div>
