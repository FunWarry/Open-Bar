<div class="user-list-container">
  <ion-card>
    <ion-card-header>
      <div class="card-header-row">
        <ion-card-title>Gestion des utilisateurs</ion-card-title>
        <ion-button color="primary" (click)="openCreateDialog()">
          <ion-icon slot="start" name="person-add"></ion-icon>
          Nouvel utilisateur
        </ion-button>
      </div>
    </ion-card-header>
    <ion-card-content>
      <div class="list-header">
        <span>Utilisateur</span>
        <span>Rôles</span>
        <span>Créé le</span>
        <span>Actions</span>
      </div>
      <ion-list>
        <ion-item *ngFor="let user of users; trackBy: trackById">
          <ion-label>
            <h3>{{ user.username }}</h3>
            <p>{{ user.email }}</p>
          </ion-label>
          <div slot="end" class="roles-badges">
            <ion-badge *ngFor="let role of user.roles" [color]="getRoleColor(role)">
              {{ role }}
            </ion-badge>
          </div>
          <ion-label slot="end" class="col-date">{{ user.createdAt | date:'dd/MM/yyyy' }}</ion-label>
          <ion-buttons slot="end">
            <ion-button fill="clear" color="tertiary" (click)="openEditDialog(user)">
              <ion-icon slot="icon-only" name="create"></ion-icon>
            </ion-button>
            <ion-button fill="clear" color="danger" (click)="openDeleteDialog(user)">
              <ion-icon slot="icon-only" name="trash"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>
</div>
