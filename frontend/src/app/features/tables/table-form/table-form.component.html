<div class="table-form-container">
  <ion-card>
    <ion-card-header>
      <ion-card-title>{{ isEditMode ? 'Modifier la Table' : 'Nouvelle Table' }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <form [formGroup]="tableForm" (ngSubmit)="onSubmit()">
        <ion-item>
          <ion-label position="stacked">Numéro de Table</ion-label>
          <ion-input formControlName="number" type="number" required></ion-input>
        </ion-item>
        <ion-note color="danger" *ngIf="tableForm.get('number')?.hasError('required') && tableForm.get('number')?.touched">
          Le numéro de table est requis
        </ion-note>

        <ion-item>
          <ion-label position="stacked">Zone</ion-label>
          <ion-select formControlName="zone" required>
            <ion-select-option value="TERRASSE">Terrasse</ion-select-option>
            <ion-select-option value="SALLE">Salle</ion-select-option>
            <ion-select-option value="BAR">Bar</ion-select-option>
          </ion-select>
        </ion-item>
        <ion-note color="danger" *ngIf="tableForm.get('zone')?.hasError('required') && tableForm.get('zone')?.touched">
          La zone est requise
        </ion-note>

        <ion-item>
          <ion-label position="stacked">Capacité</ion-label>
          <ion-input formControlName="capacity" type="number" required></ion-input>
        </ion-item>
        <ion-note color="danger" *ngIf="tableForm.get('capacity')?.hasError('required') && tableForm.get('capacity')?.touched">
          La capacité est requise
        </ion-note>
        <ion-note color="danger" *ngIf="tableForm.get('capacity')?.hasError('min') && tableForm.get('capacity')?.touched">
          La capacité doit être d'au moins 1 personne
        </ion-note>

        <div class="form-actions">
          <ion-button fill="clear" type="button" (click)="onCancel()" (keydown.enter)="onCancel()">Annuler</ion-button>
          <ion-button color="primary" type="submit" [disabled]="tableForm.invalid">
            {{ isEditMode ? 'Modifier' : 'Créer' }}
          </ion-button>
        </div>
      </form>
    </ion-card-content>
  </ion-card>
</div>
