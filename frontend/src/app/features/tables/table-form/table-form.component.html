<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="onCancel()" (keydown.enter)="onCancel()" data-testid="table-back-btn">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ isEditMode ? 'Modifier la Table' : 'Nouvelle Table' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="onCancel()" (keydown.enter)="onCancel()" data-testid="table-close-btn">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="modal-content-container">
  <form [formGroup]="tableForm" (ngSubmit)="onSubmit()" data-testid="table-form" class="table-form">

    <app-input-field
      formControlName="numero"
      type="number"
      label="Numéro de Table"
      placeholder="ex: 12"
      icon="grid-outline"
      [required]="true"
      [errorMessage]="tableForm.get('numero')?.hasError('required') && tableForm.get('numero')?.touched ? 'Le numéro de table est requis' : ''"
      testId="table-number-input">
    </app-input-field>

    <div class="select-field-group">
      <span class="field-label" id="zone-select-label">Zone <span class="required-star">*</span></span>
      <div class="select-input-wrapper">
        <ion-icon name="location-outline" class="select-icon"></ion-icon>
        <ion-select
          formControlName="zone"
          placeholder="Sélectionner une zone"
          cancelText="Annuler"
          okText="Valider"
          [interfaceOptions]="{ header: 'Zone' }"
          aria-labelledby="zone-select-label"
          data-testid="table-zone-select">
          <ion-select-option value="TERRASSE">Terrasse</ion-select-option>
          <ion-select-option value="SALLE">Salle</ion-select-option>
          <ion-select-option value="BAR">Bar</ion-select-option>
        </ion-select>
      </div>
      @if (tableForm.get('zone')?.hasError('required') && tableForm.get('zone')?.touched) {
        <p class="error-hint">La zone est requise</p>
      }
    </div>

    <app-input-field
      formControlName="capacite"
      type="number"
      label="Capacité"
      placeholder="ex: 4"
      icon="people-outline"
      [required]="true"
      [errorMessage]="tableForm.get('capacite')?.hasError('required') && tableForm.get('capacite')?.touched ? 'La capacité est requise' : (tableForm.get('capacite')?.hasError('min') && tableForm.get('capacite')?.touched ? 'La capacité doit être d\'au moins 1 personne' : '')"
      testId="table-capacity-input">
    </app-input-field>

    <div class="form-actions">
      <ion-button fill="outline" color="medium" type="button" (click)="onCancel()" (keydown.enter)="onCancel()" data-testid="table-cancel-btn">
        Annuler
      </ion-button>
      <ion-button color="primary" type="submit" [disabled]="tableForm.invalid" data-testid="table-submit-btn">
        <ion-icon slot="start" name="checkmark-circle"></ion-icon>
        {{ isEditMode ? 'Modifier' : 'Créer' }}
      </ion-button>
    </div>

  </form>
</ion-content>
