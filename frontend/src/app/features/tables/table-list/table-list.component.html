<div class="table-list-container">
  <ion-card>
    <ion-card-header>
      <div class="card-header-row">
        <ion-card-title>Tables</ion-card-title>
        <ion-button *ngIf="isAdmin$ | async" color="primary" (click)="onAdd()">
          <ion-icon slot="start" name="add"></ion-icon>
          Nouvelle Table
        </ion-button>
      </div>
    </ion-card-header>
    <ion-card-content>
      <ion-grid>
        <ion-row>
          <ion-col size="12" size-sm="6" size-md="4" size-lg="3"
                   *ngFor="let table of tables">
            <ion-card [class.occupied]="table.occupied">
              <ion-card-header>
                <ion-card-title>Table {{ table.number }}</ion-card-title>
                <ion-card-subtitle>{{ table.zone }}</ion-card-subtitle>
              </ion-card-header>
              <ion-card-content>
                <p>
                  <ion-icon name="people"></ion-icon>
                  Capacité : {{ table.capacity }} personnes
                </p>
                <ion-badge [color]="table.occupied ? 'danger' : 'success'">
                  <ion-icon [name]="table.occupied ? 'close-circle' : 'checkmark-circle'"></ion-icon>
                  {{ table.occupied ? 'Occupée' : 'Libre' }}
                </ion-badge>
              </ion-card-content>
              <ion-buttons class="card-actions">
                <ion-button fill="clear" color="primary" (click)="onView(table)">
                  <ion-icon slot="start" name="eye"></ion-icon>
                  Détails
                </ion-button>
                <ion-button *ngIf="isAdmin$ | async" fill="clear" color="tertiary" (click)="onEdit(table)">
                  <ion-icon slot="start" name="create"></ion-icon>
                  Modifier
                </ion-button>
              </ion-buttons>
            </ion-card>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-card-content>
  </ion-card>
</div>
