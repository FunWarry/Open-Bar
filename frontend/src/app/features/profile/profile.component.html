<div class="profile-container">
  <ion-card class="profile-card">
    <ion-card-header class="profile-header">
      <div class="avatar-wrapper">
        <app-user-avatar
          [name]="(currentUser$ | async)?.username"
          [role]="$any((currentUser$ | async)?.roles?.[0])"
          size="large">
        </app-user-avatar>
      </div>
      <ion-card-title>Mon Profil</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
        <app-input-field
          formControlName="username"
          label="Nom d'utilisateur"
          placeholder="Identifiant"
          icon="person-outline"
          [required]="true"
          autocomplete="username"
          [errorMessage]="profileForm.get('username')?.touched && profileForm.get('username')?.hasError('required') ? 'Le nom d\'utilisateur est requis' : undefined">
        </app-input-field>

        <app-input-field
          formControlName="email"
          label="Email"
          type="email"
          placeholder="Adresse email"
          icon="mail-outline"
          [required]="true"
          autocomplete="email"
          [errorMessage]="profileForm.get('email')?.touched && profileForm.get('email')?.hasError('required') ? 'L\'email est requis' : (profileForm.get('email')?.touched && profileForm.get('email')?.hasError('email') ? 'Format d\'email invalide' : undefined)">
        </app-input-field>

        <app-password-input
          formControlName="newPassword"
          label="Nouveau mot de passe"
          placeholder="Laissez vide pour ne pas modifier"
          autocomplete="new-password"
          [errorMessage]="profileForm.get('newPassword')?.touched && profileForm.get('newPassword')?.hasError('minlength') ? 'Le mot de passe doit contenir au moins 6 caractères' : undefined">
        </app-password-input>

        <app-password-input
          formControlName="confirmPassword"
          label="Confirmer le mot de passe"
          placeholder="Confirmez le nouveau mot de passe"
          autocomplete="new-password"
          [errorMessage]="profileForm.get('confirmPassword')?.touched && profileForm.hasError('passwordMismatch') ? 'Les mots de passe ne correspondent pas' : undefined">
        </app-password-input>

        <div class="form-actions">
          <app-action-button
            type="submit"
            variant="primary"
            expand="block"
            [disabled]="profileForm.invalid">
            Enregistrer les modifications
          </app-action-button>
        </div>
      </form>
    </ion-card-content>
  </ion-card>

  <ion-card class="info-card">
    <ion-card-header>
      <ion-card-title>Informations du compte</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <div class="info-item">
        <span class="label">Rôles :</span>
        <span class="value roles-list">
          <app-role-badge
            *ngFor="let role of (currentUser$ | async)?.roles"
            [role]="$any(role)">
          </app-role-badge>
        </span>
      </div>
      <div class="info-item">
        <span class="label">Compte créé le :</span>
        <span class="value">{{ (currentUser$ | async)?.createdAt | date:'dd/MM/yyyy' }}</span>
      </div>
      <div class="info-item">
        <span class="label">Dernière modification :</span>
        <span class="value">{{ (currentUser$ | async)?.updatedAt | date:'dd/MM/yyyy' }}</span>
      </div>
    </ion-card-content>
  </ion-card>
</div>
