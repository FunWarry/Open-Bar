<div class="setup-container">
  <div class="ellipse-bg-primary"></div>
  <div class="ellipse-bg-tertiary"></div>

  <div class="setup-card">
    <div class="card-header-section">
      <div class="brand-logo">
        <span class="logo-icon">🍹</span>
        <span class="logo-text">OpenBar</span>
      </div>
      <h1 class="card-title">{{ 'SETUP.TITLE' | transloco }}</h1>
      <p class="card-subtitle">{{ 'SETUP.SUBTITLE' | transloco }}</p>
    </div>

    <form [formGroup]="setupForm" (ngSubmit)="onSubmit()" class="setup-form">
      <app-input-field
        formControlName="username"
        [label]="'SETUP.USERNAME' | transloco"
        placeholder="admin"
        icon="person-outline"
        [required]="true"
        [errorMessage]="
          setupForm.get('username')?.touched && setupForm.get('username')?.hasError('required')
            ? ('ERRORS.FORM_INVALID' | transloco)
            : undefined
        ">
      </app-input-field>

      <app-input-field
        formControlName="email"
        type="email"
        [label]="'SETUP.EMAIL' | transloco"
        placeholder="admin@openbar.local"
        icon="mail-outline"
        [required]="true"
        [errorMessage]="
          setupForm.get('email')?.touched && setupForm.get('email')?.hasError('email')
            ? ('ERRORS.FORM_INVALID' | transloco)
            : undefined
        ">
      </app-input-field>

      <div class="form-row">
        <app-input-field
          formControlName="nom"
          [label]="'SETUP.LASTNAME' | transloco"
          placeholder="Admin">
        </app-input-field>

        <app-input-field
          formControlName="prenom"
          [label]="'SETUP.FIRSTNAME' | transloco"
          placeholder="Initial">
        </app-input-field>
      </div>

      <app-input-field
        formControlName="password"
        type="password"
        [label]="'SETUP.PASSWORD' | transloco"
        icon="lock-closed-outline"
        [required]="true">
      </app-input-field>

      <app-input-field
        formControlName="confirmPassword"
        type="password"
        [label]="'SETUP.CONFIRM_PASSWORD' | transloco"
        icon="lock-closed-outline"
        [required]="true"
        [errorMessage]="
          setupForm.touched && setupForm.hasError('passwordMismatch')
            ? ('ERRORS.FORM_INVALID' | transloco)
            : undefined
        ">
      </app-input-field>

      @if (errorMessage) {
        <div class="error-banner">
          {{ errorMessage }}
        </div>
      }

      <div class="actions-row">
        <app-action-button
          type="submit"
          variant="primary"
          size="large"
          expand="block"
          [disabled]="setupForm.invalid || loading"
          [loading]="loading">
          {{ 'SETUP.SUBMIT' | transloco }}
        </app-action-button>
      </div>
    </form>
  </div>
</div>
