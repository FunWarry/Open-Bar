<ion-header>
  <ion-toolbar class="plan-toolbar">
    <ion-title>
      Plan de salle
      <ion-badge *ngIf="hasUnsavedChanges" color="warning" class="unsaved-badge">Non sauvegardé</ion-badge>
    </ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="charger()" title="Actualiser">
        <ion-icon name="refresh-outline" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button *ngIf="isAdmin" fill="clear" (click)="toggleEditMode()" [color]="isEditMode ? 'warning' : 'medium'">
        <ion-icon [name]="isEditMode ? 'close-outline' : 'pencil-outline'" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="plan-content">
  <!-- Légende -->
  <div class="legend-bar">
    <div class="legend-item"><span class="dot dot-libre"></span><span>Libre</span></div>
    <div class="legend-item"><span class="dot dot-occupee"></span><span>Occupée</span></div>
    <div class="legend-item" *ngIf="isEditMode">
      <ion-badge color="warning" class="edit-badge">Mode édition — drag & drop actif</ion-badge>
    </div>
  </div>

  <!-- Canvas Konva -->
  <div *ngIf="isLoading" class="loading-overlay">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
  </div>
  <div #konvaContainer class="konva-container" [class.edit-mode]="isEditMode"></div>

  <!-- FAB sauvegarde (mode édition admin) -->
  <ion-fab *ngIf="isAdmin && isEditMode && hasUnsavedChanges" vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button color="success" (click)="sauvegarder()">
      <ion-icon name="save-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
