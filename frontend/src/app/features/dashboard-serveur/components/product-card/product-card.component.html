<button
  type="button"
  class="product-card"
  [class.unavailable]="isUnavailable"
  [style.--category-accent]="CategoryColor"
  [disabled]="isUnavailable"
  (click)="onCardClick()"
  (contextmenu)="onRightClick($event)"
  (touchstart)="onTouchStart($event)"
  (touchend)="onTouchEnd($event)"
  (touchmove)="onTouchMove($event)">
  <div class="product-header">
    <div class="product-icon-wrap">
      <ion-icon [name]="CategoryIcon"></ion-icon>
    </div>

    <!-- Badge Indisponible / Rupture (Visible pour tous en cas de rupture) -->
    @if (isUnavailable) {
      <span class="badge-indisponible" data-testid="badge-indisponible">
        {{ 'COCKTAILS.UNAVAILABLE' | transloco }}
      </span>
    }

    <!-- Badge Stock Faible (Visible uniquement pour Barman / Manager) -->
    @if (!isUnavailable && isStockLow) {
      <app-stock-severity-badge
        severity="FAIBLE"
        data-testid="badge-stock-faible">
      </app-stock-severity-badge>
    }
  </div>

  <div class="product-body">
    <h4 class="product-title">{{ product.nom }}</h4>
    @if (product.description) {
      <p class="product-description">{{ product.description }}</p>
    }

    <!-- Badges d'allergènes détectés sur la boisson -->
    @if (detectedAllergens.length > 0) {
      <div class="allergens-badges-row">
        @for (alg of detectedAllergens; track alg.key) {
          <span class="card-allergen-badge" [title]="('COCKTAILS.ALLERGENS.EXCLUDE_LABEL' | transloco) + ' ' + (alg.labelKey | transloco)">
            <span class="alg-symbol">{{ alg.symbol }}</span> {{ alg.labelKey | transloco }}
          </span>
        }
      </div>
    }

    <div class="product-footer-row">
      <div class="product-price-box">
        @if (product.isHappyHour && product.originalPrice) {
          <span class="original-price-struck" data-testid="product-original-price">
            {{ product.originalPrice | appCurrency }}
          </span>
        }
        <span class="product-price" [class.discounted]="product.isHappyHour" data-testid="product-price">
          {{ product.prix | appCurrency }}
        </span>
        @if (product.isHappyHour) {
          <span class="hh-pill" data-testid="product-hh-pill">HH</span>
        }
      </div>
      @if (product.variantes && product.variantes.length > 0) {
        <span class="variants-badge">
          {{ 'SERVEUR.FORMATS_COUNT' | transloco: { count: product.variantes.length } }}
        </span>
      }
    </div>
  </div>
</button>
