<div class="product-card" [class.unavailable]="isUnavailable" [style.--category-accent]="CategoryColor">
  <div class="product-header">
    <div class="product-icon-wrap">
      <ion-icon [name]="CategoryIcon"></ion-icon>
    </div>

    <!-- Badge Indisponible / Rupture (Visible pour tous en cas de rupture) -->
    <span *ngIf="isUnavailable" class="badge-indisponible" data-testid="badge-indisponible">
      Indisponible
    </span>

    <!-- Badge Stock Faible (Visible uniquement pour Barman / Manager) -->
    <app-stock-severity-badge
      *ngIf="!isUnavailable && isStockLow"
      severity="FAIBLE"
      data-testid="badge-stock-faible">
    </app-stock-severity-badge>
  </div>

  <div class="product-body">
    <h4 class="product-title">{{ product.nom }}</h4>
    <p class="product-description" *ngIf="product.description">{{ product.description }}</p>
    <div class="product-price">{{ product.prix | number:'1.2-2' }} €</div>
  </div>

  <div class="product-footer">
    <app-action-button
      variant="primary"
      size="small"
      iconLeft="add-outline"
      [disabled]="isUnavailable"
      (click)="onAdd()"
      (keyup.enter)="onAdd()">
      {{ isUnavailable ? 'Épuisé' : 'Ajouter' }}
    </app-action-button>
  </div>
</div>
