<article
  class="product-card"
  [class.unavailable]="isUnavailable"
  [style.--category-accent]="CategoryColor"
  (click)="onCardClick()"
  (keyup.enter)="onCardClick()"
  (contextmenu)="onRightClick($event)"
  (touchstart)="onTouchStart($event)"
  (touchend)="onTouchEnd($event)"
  (touchmove)="onTouchMove($event)"
  tabindex="0"
  [attr.aria-disabled]="isUnavailable">
  <div class="product-header">
    <div class="product-icon-wrap">
      <ion-icon [name]="CategoryIcon"></ion-icon>
    </div>

    <!-- Badge Indisponible / Rupture (Visible pour tous en cas de rupture) -->
    <span *ngIf="isUnavailable" class="badge-indisponible" data-testid="badge-indisponible">
      Indisponible
    </span>

    <!-- Badge Stock Faible (Visible uniquement pour Barman / Manager) -->
    <app-stock-severity-badge
      *ngIf="!isUnavailable && isStockLow"
      severity="FAIBLE"
      data-testid="badge-stock-faible">
    </app-stock-severity-badge>
  </div>

  <div class="product-body">
    <h4 class="product-title">{{ product.nom }}</h4>
    <p class="product-description" *ngIf="product.description">{{ product.description }}</p>
    <div class="product-footer-row">
      <span class="product-price">{{ product.prix | number:'1.2-2' }} €</span>
      <span *ngIf="product.variantes && product.variantes.length > 0" class="variants-badge">
        {{ product.variantes.length }} formats
      </span>
    </div>
  </div>
</article>
