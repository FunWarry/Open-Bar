<div class="tab-modal-wrapper" data-testid="bar-tab-modal">
  <!-- Modal Header -->
  <div class="modal-header">
    <div class="header-main-group">
      <div class="tab-avatar-badge" [class.edit]="!!tab">
        <ion-icon name="receipt-outline"></ion-icon>
      </div>
      <div class="header-text">
        <h2 class="modal-title" data-testid="modal-tab-title">
          {{ (tab ? 'TABS.MODAL_EDIT_TITLE' : 'TABS.MODAL_CREATE_TITLE') | transloco }}
        </h2>
        <div class="modal-meta-tags">
          <span class="meta-tag">
            <ion-icon [name]="tab ? 'create-outline' : 'add-circle-outline'"></ion-icon>
            <span>{{ (tab ? 'COMMON.EDIT' : 'COMMON.ADD') | transloco }}</span>
          </span>
          @if (tab?.openedAt) {
            <span class="meta-tag">
              <ion-icon name="time-outline"></ion-icon>
              <span>{{ tab.openedAt | date:'shortTime' }}</span>
            </span>
          }
        </div>
      </div>
    </div>

    <button
      type="button"
      class="close-icon-btn"
      (click)="dismiss()"
      [attr.aria-label]="'COMMON.CLOSE' | transloco"
      data-testid="btn-close-tab-modal">
      <ion-icon name="close-outline"></ion-icon>
    </button>
  </div>

  <!-- Modal Body -->
  <div class="modal-body">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="tab-form-container" data-testid="form-bar-tab">
      
      <!-- Customer / Tab Name -->
      <app-input-field
        [attr.data-testid]="'input-tab-name'"
        formControlName="nom"
        [label]="'TABS.FIELD_NAME' | transloco"
        [placeholder]="'TABS.FIELD_NAME_PLACEHOLDER' | transloco"
        icon="person-outline"
        [required]="true"
        testId="input-tab-name">
      </app-input-field>

      <!-- Customer Reference / Card -->
      <app-input-field
        [attr.data-testid]="'input-tab-ref'"
        formControlName="clientReference"
        [label]="'TABS.FIELD_REF' | transloco"
        [placeholder]="'TABS.FIELD_REF_PLACEHOLDER' | transloco"
        icon="card-outline"
        testId="input-tab-ref">
      </app-input-field>

      <!-- Deposit / Caution Amount -->
      <app-input-field
        [attr.data-testid]="'input-tab-caution'"
        formControlName="cautionMontant"
        type="number"
        [label]="'TABS.FIELD_CAUTION' | transloco"
        placeholder="0.00"
        icon="shield-checkmark-outline"
        testId="input-tab-caution">
      </app-input-field>

      <!-- Location Attachment Selector (Bar vs Table) -->
      <fieldset class="form-field-group location-fieldset">
        <legend class="field-label">
          <ion-icon name="restaurant-outline"></ion-icon>
          <span>{{ 'TABS.FIELD_LOCATION' | transloco }} *</span>
        </legend>
        <div class="location-toggle-group">
          <button
            type="button"
            class="location-toggle-btn"
            [class.active]="form.get('locationType')?.value === 'BAR'"
            (click)="setLocationType('BAR')"
            data-testid="btn-location-bar">
            <ion-icon name="wine-outline"></ion-icon>
            <span>{{ 'TABS.LOCATION_BAR' | transloco }}</span>
          </button>
          <button
            type="button"
            class="location-toggle-btn"
            [class.active]="form.get('locationType')?.value === 'TABLE'"
            (click)="setLocationType('TABLE')"
            data-testid="btn-location-table">
            <ion-icon name="restaurant-outline"></ion-icon>
            <span>{{ 'TABS.LOCATION_TABLE' | transloco }}</span>
          </button>
        </div>
      </fieldset>

      <!-- Physical Table Dropdown (Shown when Table selected) -->
      @if (form.get('locationType')?.value === 'TABLE') {
        <div class="form-field-group table-select-group">
          <app-searchable-select
            formControlName="tableOriginaleId"
            [label]="'TABS.SELECT_TABLE' | transloco"
            [placeholder]="'TABS.SELECT_TABLE_PLACEHOLDER' | transloco"
            [options]="tableOptions"
            [enableSearch]="true"
            testId="select-tab-table">
          </app-searchable-select>
        </div>
      }

      <!-- Notes / Instructions -->
      <div class="form-field-group">
        <label class="field-label" for="input-tab-notes">
          <ion-icon name="chatbox-ellipses-outline"></ion-icon>
          <span>{{ 'TABS.FIELD_NOTES' | transloco }}</span>
        </label>
        <div class="textarea-wrapper">
          <textarea
            id="input-tab-notes"
            formControlName="notes"
            rows="3"
            class="styled-textarea"
            [placeholder]="'TABS.FIELD_NOTES_PLACEHOLDER' | transloco"
            data-testid="input-tab-notes"></textarea>
        </div>
      </div>

      <!-- Modal Footer Actions -->
      <div class="modal-footer">
        <button
          type="button"
          class="btn-action btn-secondary"
          (click)="dismiss()"
          data-testid="btn-cancel-tab-modal">
          {{ 'TABS.BTN_CANCEL' | transloco }}
        </button>

        <button
          type="submit"
          class="btn-action btn-primary"
          [disabled]="form.invalid || isSubmitting"
          data-testid="btn-submit-tab-modal">
          @if (isSubmitting) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            <ion-icon name="checkmark-outline"></ion-icon>
          }
          <span>{{ (tab ? 'TABS.BTN_SAVE' : 'TABS.BTN_CREATE') | transloco }}</span>
        </button>
      </div>
    </form>
  </div>
</div>
