<ion-header class="ion-no-border serveur-dashboard-header">
  <ion-toolbar>
    <div class="header-content">
      <div class="header-title-group">
        <h1 class="page-title">Espace Serveur</h1>
        <div class="status-summary-pills">
          <span class="summary-pill total">
            <span class="dot"></span> {{ tables.length }} Tables
          </span>
          <span class="summary-pill occupees">
            <span class="dot"></span> {{ countOccupees }} Occupées
          </span>
          <span class="summary-pill libres">
            <span class="dot"></span> {{ countLibres }} Libres
          </span>
        </div>
      </div>

      <div class="header-actions">
        <!-- Sélecteur Vue Grille vs Vue Plan 2D -->
        <div class="view-mode-pill-toggle">
          <button
            class="toggle-btn"
            [class.active]="viewMode === 'grid'"
            (click)="onViewModeToggle('grid')"
            title="Vue Grille (Tuiles)">
            <ion-icon name="grid-outline"></ion-icon>
            <span class="btn-label">Grille</span>
          </button>
          <button
            class="toggle-btn"
            [class.active]="viewMode === 'plan'"
            (click)="onViewModeToggle('plan')"
            title="Vue Plan 2D">
            <ion-icon name="map-outline"></ion-icon>
            <span class="btn-label">Plan 2D</span>
          </button>
        </div>

        <button class="kanban-action-btn" (click)="naviguerKanban()" title="Suivi des commandes">
          <ion-icon name="list-outline"></ion-icon>
          <span class="btn-label">Suivi</span>
        </button>
      </div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="dashboard-serveur-content ion-padding">
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <!-- ONGLET 1 : TABLES SERVEUR -->
  <ng-container *ngIf="activeTab === 'tables'">
    <!-- PANEL DE CONTROL FLUIDE ET COMPACT -->
    <div class="filter-panel">
      <!-- Ligne 1 : Boutons Pilules de Statut (Toutes, Occupées, Libres) -->
      <div class="status-segment-row">
        <div class="segment-pill-wrapper">
          <button
            class="segment-pill"
            [class.active]="selectedFilter === 'toutes'"
            (click)="onFilterSelect('toutes')">
            Toutes <span class="badge">{{ tables.length }}</span>
          </button>
          <button
            class="segment-pill warning"
            [class.active]="selectedFilter === 'occupees'"
            (click)="onFilterSelect('occupees')">
            Occupées <span class="badge">{{ countOccupees }}</span>
          </button>
          <button
            class="segment-pill success"
            [class.active]="selectedFilter === 'libres'"
            (click)="onFilterSelect('libres')">
            Libres <span class="badge">{{ countLibres }}</span>
          </button>
        </div>
      </div>

      <!-- Ligne 2 : Filtres Étage & Zone compacts -->
      <div class="sub-filters-row">
        <!-- Groupe Étage -->
        <div class="filter-row-group">
          <span class="group-label">
            <ion-icon name="layers-outline"></ion-icon>
            Étage
          </span>
          <div class="chip-scroll">
            <app-filter-chip
              label="Tous"
              [active]="selectedEtage === 'TOUS'"
              (chipClick)="onEtageFilterChange('TOUS')">
            </app-filter-chip>
            <app-filter-chip
              *ngFor="let etage of etagesList"
              [label]="etage.nom"
              [active]="selectedEtage === etage.code"
              (chipClick)="onEtageFilterChange(etage.code)">
            </app-filter-chip>
          </div>
        </div>

        <!-- Séparateur vertical -->
        <div class="filter-divider"></div>

        <!-- Groupe Zone -->
        <div class="filter-row-group">
          <span class="group-label">
            <ion-icon name="funnel-outline"></ion-icon>
            Zone
          </span>
          <div class="chip-scroll">
            <app-filter-chip
              label="Toutes"
              [active]="selectedZone === 'TOUTES'"
              (chipClick)="onZoneFilterChange('TOUTES')">
            </app-filter-chip>
            <app-filter-chip
              *ngFor="let zoneNom of uniqueZoneNames"
              [label]="zoneNom"
              [active]="selectedZone === zoneNom"
              (chipClick)="onZoneFilterChange(zoneNom)">
            </app-filter-chip>
          </div>
        </div>
      </div>
    </div>

    <!-- VUE 1 : GRILLE (TUILES) -->
    <div class="mobile-tables-grid" *ngIf="viewMode === 'grid'">
      <app-mobile-table-card
        *ngFor="let table of filteredTables; trackBy: trackById"
        [table]="table"
        [waitTimeMinutes]="getWaitTimeMinutes(table)"
        (tableSelect)="onSelectionner($event)"
        (newOrder)="onNewOrderForTable($event)">
      </app-mobile-table-card>
    </div>

    <!-- VUE 2 : PLAN DE SALLE 2D KONVA.JS -->
    <div class="plan-salle-interactive-wrapper" *ngIf="viewMode === 'plan'">
      <div class="plan-legend-bar">
        <span class="legend-item"><span class="color-dot libre"></span> Libre</span>
        <span class="legend-item"><span class="color-dot occupee"></span> Occupée (&lt;20 min)</span>
        <span class="legend-item"><span class="color-dot retard"></span> Attente prolongée (&gt;20 min)</span>
        <span class="legend-info">Cliquez sur une table pour prendre une commande</span>
      </div>
      <div #konvaFloorPlanContainer class="konva-floor-plan-container"></div>
    </div>
  </ng-container>

  <!-- ONGLET 2 : PRISE DE COMMANDE RAPIDE & MENU PRODUITS -->
  <ng-container *ngIf="activeTab === 'commande'">
    <div class="order-taking-layout">
      <!-- Zone Produits & Filtres (Gauche) -->
      <div class="products-section">
        <div class="categories-bar">
          <app-filter-chip
            label="Tous"
            [active]="selectedCategory === 'ALL'"
            (chipClick)="onCategorySelect('ALL')">
          </app-filter-chip>
          <app-filter-chip
            label="Cocktails"
            [active]="selectedCategory === 'COCKTAIL'"
            (chipClick)="onCategorySelect('COCKTAIL')">
          </app-filter-chip>
          <app-filter-chip
            label="Bières"
            [active]="selectedCategory === 'BEER'"
            (chipClick)="onCategorySelect('BEER')">
          </app-filter-chip>
          <app-filter-chip
            label="Softs"
            [active]="selectedCategory === 'SOFT'"
            (chipClick)="onCategorySelect('SOFT')">
          </app-filter-chip>
          <app-filter-chip
            label="Snacks"
            [active]="selectedCategory === 'SNACK'"
            (chipClick)="onCategorySelect('SNACK')">
          </app-filter-chip>
          <app-filter-chip
            label="Shots"
            [active]="selectedCategory === 'SHOT'"
            (chipClick)="onCategorySelect('SHOT')">
          </app-filter-chip>
        </div>

        <div class="products-grid">
          <app-product-card
            *ngFor="let p of filteredProducts; trackBy: trackById"
            [product]="p"
            (add)="onAddToCart($event)">
          </app-product-card>
        </div>
      </div>

      <!-- Zone Tiroir Panier (Droite) -->
      <div class="cart-section">
        <app-cart-drawer
          [cart]="cart"
          [tables]="tables"
          (quantityChange)="onCartQuantityChanged($event)"
          (removeItem)="onCartItemRemoved($event)"
          (tableSelect)="onTableSelectForOrder($event)"
          (submitOrder)="onSubmitCart()"
          (clearCart)="onClearCart()">
        </app-cart-drawer>
      </div>
    </div>
  </ng-container>
</ion-content>

<!-- BOTTOM NAVIGATION MOBILE / TABLETTE -->
<app-bottom-navigation
  [activeTab]="activeTab"
  [cartBadgeCount]="cartTotalCount"
  (tabSelect)="onTabSelected($event)">
</app-bottom-navigation>
