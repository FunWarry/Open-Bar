<ion-header>
  <ion-toolbar class="serveur-toolbar">
    <ion-title>
      <span class="toolbar-title">Tables</span>
      <span class="toolbar-role">WAITER</span>
    </ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="naviguerKanban()" title="Suivi commandes">
        <ion-icon name="list-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="serveur-content">
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <!-- Légende statuts (LegendItem Figma 126:141) -->
  <div class="legend-bar">
    <div class="legend-item">
      <span class="legend-dot dot-free"></span>
      <span class="legend-label">Libre ({{ countLibres }})</span>
    </div>
    <div class="legend-item">
      <span class="legend-dot dot-occupied"></span>
      <span class="legend-label">Occupée ({{ countOccupees }})</span>
    </div>
    <div class="legend-item">
      <span class="legend-dot dot-inprogress"></span>
      <span class="legend-label">En cours</span>
    </div>
  </div>

  <!-- Filtres segment (CategoryTab Figma 128:84) -->
  <ion-segment
    [value]="selectedFilter"
    (ionChange)="onSegmentChange($event)"
    class="filter-segment">
    <ion-segment-button value="toutes">
      <ion-label>Toutes ({{ tables.length }})</ion-label>
    </ion-segment-button>
    <ion-segment-button value="occupees">
      <ion-label>Occupées ({{ countOccupees }})</ion-label>
    </ion-segment-button>
    <ion-segment-button value="libres">
      <ion-label>Libres ({{ countLibres }})</ion-label>
    </ion-segment-button>
  </ion-segment>

  <!-- Grille de tables responsive -->
  <ion-grid class="tables-grid">
    <ion-row>
      <ion-col
        size="12"
        size-sm="6"
        size-md="4"
        size-lg="3"
        *ngFor="let table of filteredTables; trackBy: trackById">
        <app-table-card
          [table]="table"
          (liberer)="onLiberer($event)"
          (selectionner)="onSelectionner($event)">
        </app-table-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- État vide -->
  <div *ngIf="!isLoading && filteredTables.length === 0" class="empty-state">
    <p class="empty-icon">🪑</p>
    <p class="empty-text">
      Aucune table
      <ng-container *ngIf="selectedFilter !== 'toutes'">
        {{ selectedFilter === 'occupees' ? 'occupée' : 'libre' }}
      </ng-container>
    </p>
  </div>
</ion-content>
