<div class="cocktail-list-container">
  <ion-card>
    <ion-card-header>
      <div class="card-header-row">
        <ion-card-title>Liste des Cocktails</ion-card-title>
        <ion-button *ngIf="isAdmin$ | async" color="primary" (click)="onAdd()">
          <ion-icon slot="start" name="add"></ion-icon>
          Nouveau Cocktail
        </ion-button>
      </div>
    </ion-card-header>
    <ion-card-content>
      <div class="list-header">
        <span>Nom</span>
        <span>Catégorie</span>
        <span>Prix</span>
        <span>Actions</span>
      </div>
      <ion-list>
        <ion-item *ngFor="let cocktail of items; trackBy: trackById">
          <ion-label>
            <h3>{{ cocktail.nom }}</h3>
            <p>{{ cocktail.categorie }}</p>
          </ion-label>
          <ion-badge slot="end" color="warning" *ngIf="isHorsSaison(cocktail)">
            Hors saison
          </ion-badge>
          <ion-badge slot="end" color="primary">
            {{ cocktail.prix | currency:'EUR' }}
          </ion-badge>
          <ion-buttons slot="end">
            <ion-button fill="clear" color="tertiary" (click)="onEdit(cocktail)">
              <ion-icon slot="icon-only" name="create"></ion-icon>
            </ion-button>
            <ion-button fill="clear" color="danger" (click)="onDelete(cocktail)">
              <ion-icon slot="icon-only" name="trash"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>
</div>
