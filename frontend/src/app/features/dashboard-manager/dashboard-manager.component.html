<ion-header>
  <ion-toolbar class="manager-toolbar">
    <ion-title>
      <span class="toolbar-title">📊 OpenBar Manager</span>
      <app-role-badge [role]="'MANAGER'"></app-role-badge>
    </ion-title>
  </ion-toolbar>
</ion-header>

<!-- État chargé -->
<ion-content *ngIf="stats && !loading" class="manager-content">
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <!-- Quick Access Toolbar for Manager -->
  <div class="manager-quick-actions ion-padding-horizontal ion-margin-top">
    <ion-button routerLink="/manager/employees" color="primary" fill="solid" data-testid="manager-btn-employees">
      <ion-icon name="people-outline" slot="start"></ion-icon>
      Gestion du personnel & Shifts
    </ion-button>

    <ion-button routerLink="/manager/schedule" color="tertiary" fill="solid" class="ion-margin-start" data-testid="manager-btn-schedule">
      <ion-icon name="calendar-outline" slot="start"></ion-icon>
      Planning Semaine
    </ion-button>
  </div>

  <!-- KPIs — grille 2×2 -->
  <ion-grid class="stats-grid">
    <ion-row>
      <ion-col size="12" size-sm="6" size-md="3">
        <app-stat-card
          label="Tables occupées"
          [value]="stats.tablesOccupees + '/' + stats.tablesTotales"
          icon="restaurant-outline"
          color="warning"
          trendDirection="neutral">
        </app-stat-card>
      </ion-col>
      <ion-col size="12" size-sm="6" size-md="3">
        <app-stat-card
          label="CA du jour"
          [value]="formatCurrency(stats.chiffreAffairesJour)"
          icon="cash-outline"
          color="success"
          trend="+12%"
          trendDirection="up">
        </app-stat-card>
      </ion-col>
      <ion-col size="12" size-sm="6" size-md="3">
        <app-stat-card
          label="Commandes actives"
          [value]="stats.commandesEnAttente + stats.commandesEnPreparation + stats.commandesPret"
          icon="receipt-outline"
          color="primary"
          trendDirection="neutral">
        </app-stat-card>
      </ion-col>
      <ion-col size="12" size-sm="6" size-md="3">
        <app-stat-card
          label="Stock critique"
          [value]="stats.stockIngredientsCritiques"
          icon="alert-circle-outline"
          color="danger"
          trendDirection="down">
        </app-stat-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- Top cocktails avec barre de progression — Figma 265:160 -->
  <ion-card class="section-card" *ngIf="stats.topCocktails && stats.topCocktails.length > 0">
    <ion-card-header>
      <ion-card-title>🍹 Top Cocktails du Jour</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <div
        class="top-cocktail-row"
        *ngFor="let cocktail of stats.topCocktails; let i = index; trackBy: trackByCocktailId">
        <span class="rank">{{ getRankLabel(i) }}</span>
        <span class="cocktail-nom">{{ cocktail.nom }}</span>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" [style.width.%]="getBarWidth(cocktail)"></div>
        </div>
        <span class="vendus">{{ cocktail.nombreCommandes }} vendus</span>
      </div>
    </ion-card-content>
  </ion-card>

  <!-- Ongoing Orders — Kanban Figma 495:3673 -->
  <ion-card class="section-card">
    <ion-card-header>
      <ion-card-title>📋 Ongoing Orders</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <app-kanban-board [orders]="ongoingOrders"></app-kanban-board>
    </ion-card-content>
  </ion-card>
</ion-content>

<!-- État chargement -->
<ion-content *ngIf="loading">
  <app-empty-state title="Chargement des statistiques..." icon="sync-outline"></app-empty-state>
</ion-content>

<!-- État erreur -->
<ion-content *ngIf="!stats && !loading">
  <app-empty-state title="Impossible de charger les statistiques" description="Veuillez réessayer plus tard" icon="warning-outline"></app-empty-state>
</ion-content>
