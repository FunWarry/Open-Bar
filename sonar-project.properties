sonar.projectKey=FunWarry_Open-Bar
sonar.organization=funwarry
sonar.projectName=Open-Bar

# ── Sources ──────────────────────────────────────────────────────────────────
sonar.sources=backend/src/main/java,frontend/src/app
sonar.tests=backend/src/test/java,frontend/src/test
sonar.sourceEncoding=UTF-8

# ── Java (Spring Boot) ────────────────────────────────────────────────────────
sonar.java.binaries=backend/target/classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# ── TypeScript / Angular ──────────────────────────────────────────────────────
sonar.javascript.lcov.reportPaths=frontend/coverage/gestion-cocktail-frontend/lcov.info

# ── Exclusions ────────────────────────────────────────────────────────────────
sonar.exclusions=**/node_modules/**
sonar.coverage.exclusions=**/node_modules/**,**/*.spec.ts,**/DockerDbInitializer.java,**/models/**,**/dto/**,**/config/**,**/app.routes.ts
