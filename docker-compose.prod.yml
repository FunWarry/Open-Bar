name: openbar-prod

services:
  postgres:
    image: postgres:15-alpine
    command: >
      postgres
      -c logging_collector=on
      -c log_destination=stderr,csvlog
      -c log_directory=/var/log/openbar/postgres
      -c log_filename=postgresql-%Y-%m-%d_%H%M%S.log
      -c log_rotation_age=1d
      -c log_rotation_size=10MB
      -c log_min_messages=warning
      -c log_line_prefix=%m [%p] %q%u@%d 
    environment:
      POSTGRES_DB: openbar
      POSTGRES_USER: openbar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - openbar_logs:/var/log/openbar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbar"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/openbar
      SPRING_DATASOURCE_USERNAME: openbar
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: prod
      OPENBAR_CORS_ALLOWED_ORIGINS: ${OPENBAR_CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*,https://open-bar.freeboxos.fr,http://192.168.*:*,http://10.*:*,http://172.16.*:*}
      LOG_PATH: /var/log/openbar/backend
    volumes:
      - openbar_logs:/var/log/openbar
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    volumes:
      - openbar_logs:/var/log/openbar
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: unless-stopped

  logrotate:
    build: ./docker/logrotate
    volumes:
      - openbar_logs:/var/log/openbar
    restart: unless-stopped

  backup:
    image: prodrigestivill/postgres-backup-local:15-alpine
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: openbar
      POSTGRES_USER: openbar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: ${BACKUP_SCHEDULE:-0 3 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      BACKUP_DIR: /backups
      HEALTHCHECK_PORT: "8080"
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - openbar_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  openbar_logs:
  openbar_backups:

