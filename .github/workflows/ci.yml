name: CI — Build & Test

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

# Annule les runs précédents sur la même branche/PR pour économiser les minutes CI
concurrency:
  # Pour les PRs, utiliser le nom de branche source (head_ref) pour que les runs successifs
  # sur la même branche s'annulent correctement. Pour les pushs directs sur dev/master,
  # utiliser la ref classique.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Permissions minimales au niveau workflow (principe du moindre privilège)
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 22 + Maven)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write        # requis par mikepenz/action-junit-report pour créer des check runs
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: openbar_test
          POSTGRES_USER: openbar
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 22
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test
        working-directory: backend
        run: mvn verify --no-transfer-progress
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/openbar_test
          SPRING_DATASOURCE_USERNAME: openbar
          SPRING_DATASOURCE_PASSWORD: test_password
          JWT_SECRET: test_jwt_secret_for_ci_only_not_used_in_prod

      - name: Publish backend test results
        uses: mikepenz/action-junit-report@v4
        if: always()  # afficher même si les tests ont échoué
        with:
          report_paths: 'backend/target/surefire-reports/*.xml'
          check_name: 'Backend Test Results'
          fail_on_failure: true

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: backend/target/site/jacoco/jacoco.xml
          retention-days: 7
          if-no-files-found: warn

  frontend:
    name: Frontend (Node 22 + Angular)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write        # requis par mikepenz/action-junit-report

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: TypeScript type check
        working-directory: frontend
        run: npx --no-install tsc --noEmit --project tsconfig.app.json

      - name: Security audit (critical only)
        working-directory: frontend
        run: npm audit --audit-level=critical

      - name: Run tests with coverage
        working-directory: frontend
        run: npm run test:ci

      - name: Upload LCOV coverage report
        uses: actions/upload-artifact@v4
        with:
          name: lcov-coverage
          path: frontend/coverage/gestion-cocktail-frontend/lcov.info
          retention-days: 7
          if-no-files-found: warn

      - name: Build production
        working-directory: frontend
        run: npm run build -- --configuration production

  sonar:
    name: SonarCloud Analysis
    needs: [backend, frontend]
    # SonarCloud (plan gratuit) n'autorise l'analyse "push" complète que sur la branche
    # principale (master) — les branches courtes comme `dev` ne sont analysées que via
    # les PR. Lancer ce job sur un push direct vers dev échoue systématiquement avec
    # "Not authorized or project not found" (cf. #140/#147).
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # pour les commentaires SonarCloud sur les PRs
      statuses: write       # pour les status checks SonarCloud
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones cause SonarCloud issues

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download JaCoCo report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-coverage
          path: backend/target/site/jacoco

      - name: Download LCOV report
        uses: actions/download-artifact@v4
        with:
          name: lcov-coverage
          path: frontend/coverage/gestion-cocktail-frontend

      - name: Compile backend for SonarCloud
        run: mvn -f backend/pom.xml test-compile -q --no-transfer-progress

      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@v3
        with:
          args: >
            -Dsonar.qualitygate.wait=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
